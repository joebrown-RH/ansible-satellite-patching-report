---
- name: Generate Satellite Patching Report
  hosts: localhost
  gather_facts: true

  roles:
    - role: satellite_patching_report
      vars:
        # Satellite connection - requires AAP credential that injects host, username, password
        satellite_server: "{{ host }}"
        satellite_username: "{{ username }}"
        satellite_password: "{{ password }}"
        satellite_validate_certs: false

        # Report configuration
        report_days_back: 7
        report_format: "both"  # Generate both HTML and CSV

        # AAP artifacts - reports will be available in AAP UI after job completes
        use_aap_artifacts: true
