---
# This file demonstrates multiple methods to persist files generated in ephemeral execution environments
# Choose the method(s) that work best for your environment

- name: Debug artifact directory configuration
  ansible.builtin.debug:
    msg:
      - "use_aap_artifacts: {{ use_aap_artifacts }}"
      - "Target artifact directory: /runner/artifacts"
      - "Report timestamp: {{ report_timestamp }}"
      - "Generated report files: {{ generated_report_files }}"
  when: use_aap_artifacts | bool

- name: Ensure AAP artifact directory exists
  ansible.builtin.file:
    path: "/runner/artifacts"
    state: directory
    mode: '0755'
  delegate_to: localhost
  when: use_aap_artifacts | bool

- name: Copy reports to AAP artifact directory (base path for AAP 2.x)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/runner/artifacts/{{ report_timestamp }}_{{ item | basename }}"
    mode: '0644'
  loop: "{{ generated_report_files }}"
  delegate_to: localhost
  when:
    - use_aap_artifacts | bool
  register: artifact_copy

- name: Register artifacts with AAP (for AAP 2.x UI display)
  ansible.builtin.set_stats:
    data:
      artifacts:
        html_report: "/runner/artifacts/{{ report_timestamp }}_{{ generated_report_files[0] | basename }}"
        csv_report: "/runner/artifacts/{{ report_timestamp }}_{{ generated_report_files[1] | basename }}"
    per_host: false
  when:
    - use_aap_artifacts | bool
    - artifact_copy is changed
  delegate_to: localhost

- name: Display AAP artifact information
  ansible.builtin.debug:
    msg:
      - "Reports copied to AAP artifact directory: /runner/artifacts/"
      - "HTML Report: {{ report_timestamp }}_{{ generated_report_files[0] | basename }}"
      - "CSV Report: {{ report_timestamp }}_{{ generated_report_files[1] | basename }}"
      - "Files are preserved and should be accessible via AAP UI"
      - "Check: Job Details -> Output (scroll down for artifact links)"
  when:
    - use_aap_artifacts | bool
    - artifact_copy is changed

- name: Include S3 upload tasks
  ansible.builtin.include_tasks: upload_s3.yml
  when:
    - persist_to_s3 | bool
    - s3_bucket | length > 0

- name: Include NFS tasks
  ansible.builtin.include_tasks: upload_nfs.yml
  when:
    - persist_to_nfs | bool
    - nfs_mount_path | length > 0

- name: Clone git repository for report storage
  ansible.builtin.git:
    repo: "{{ git_repo_url }}"
    dest: "/tmp/report_git_repo"
    version: "{{ git_branch }}"
    force: true
  delegate_to: localhost
  when:
    - persist_to_git | bool
    - git_repo_url | length > 0

- name: Copy reports to git repository
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/tmp/report_git_repo/reports/{{ item | basename }}"
    mode: '0644'
  loop: "{{ generated_report_files }}"
  delegate_to: localhost
  when:
    - persist_to_git | bool
    - git_repo_url | length > 0

- name: Commit and push reports to git
  ansible.builtin.shell: |
    cd /tmp/report_git_repo
    git config user.name "Ansible Automation"
    git config user.email "ansible@example.com"
    git add reports/
    git commit -m "Add satellite patching reports - {{ ansible_date_time.iso8601 }}"
    git push origin {{ git_branch }}
  delegate_to: localhost
  when:
    - persist_to_git | bool
    - git_repo_url | length > 0
  register: git_push
  changed_when: "'nothing to commit' not in git_push.stdout"

- name: Include email tasks
  ansible.builtin.include_tasks: send_email.yml
  when:
    - email_report | bool
    - email_to | length > 0

- name: Send reports to webhook/API
  ansible.builtin.uri:
    url: "{{ webhook_url }}"
    method: POST
    body_format: json
    body:
      timestamp: "{{ ansible_date_time.iso8601 }}"
      report_type: "satellite_patching"
      report_period_days: "{{ report_days_back }}"
      total_jobs: "{{ patching_report_data.total_jobs }}"
      reports:
        - name: "{{ item | basename }}"
          content: "{{ lookup('file', item) | b64encode }}"
    status_code: [200, 201, 202]
    headers:
      Content-Type: "application/json"
  loop: "{{ generated_report_files }}"
  delegate_to: localhost
  when:
    - send_to_webhook | bool
    - webhook_url | length > 0

- name: Display webhook upload information
  ansible.builtin.debug:
    msg: "Reports sent to webhook: {{ webhook_url }}"
  when:
    - send_to_webhook | bool
    - webhook_url | length > 0
