---
# Email report tasks - requires community.general collection
# Only included when email_report is enabled

- name: Email the reports
  community.general.mail:
    host: "{{ smtp_host }}"
    port: "{{ smtp_port }}"
    from: "{{ email_from }}"
    to: "{{ email_to }}"
    subject: "Satellite Patching Report - {{ ansible_date_time.date }}"
    body: |
      Satellite Patching Report for the last {{ report_days_back }} days.

      Report generated: {{ ansible_date_time.iso8601 }}
      Total patching jobs: {{ patching_report_data.total_jobs }}

      Please see attached reports for details.
    attach: "{{ generated_report_files }}"
  delegate_to: localhost

- name: Display email information
  ansible.builtin.debug:
    msg: "Reports emailed to: {{ email_to | join(', ') }}"
